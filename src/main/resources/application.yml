spring:
  application:
    name: gimme-comments-server
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jpa:
    open-in-view: false
app:
  jwt:
    expiration-ms: 2592000000
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState, db
logging:
  level:
    io.github.rohits1402.gimmecomments: INFO
    org.springframework: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"