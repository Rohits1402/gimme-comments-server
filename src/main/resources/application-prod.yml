server:
  port: ${PORT:8080}
spring:
  mongodb:
    uri: ${MONGO_URI}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  jwt:
    secret: ${JWT_SECRET}
  mail:
    from: ${MAIL_USERNAME}
  s3:
    bucket: ${S3_BUCKET}
    region: ap-south-1