server:
  port: ${PORT:8080}
spring:
  mongodb:
    uri: ${MONGO_URI}
  app:
    brevo:
      api-key: ${BREVO_API_KEY}
    mail:
      from: ${MAIL_FROM}
      from-name: GimmeComments
app:
  jwt:
    secret: ${JWT_SECRET}
  mail:
    from: ${MAIL_USERNAME}
  s3:
    bucket: ${S3_BUCKET}
    region: ap-south-1