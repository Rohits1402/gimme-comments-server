server:
  port: ${PORT:8080}
  forward-headers-strategy: native
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret: ${JWT_SECRET}
  brevo:
    api-key: ${BREVO_API_KEY}
  mail:
    from: ${MAIL_FROM}
    from-name: GimmeComments
  s3:
    bucket: ${S3_BUCKET}
    region: ap-south-1