<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GimmeComments — dev harness</title>
    <style>
      /* This page stands in for a third-party site during development. It is not
         shipped: the real bundle is injected by initialize-gimme-comments.js.
         The styles below are deliberately loud. If the widget leaks CSS outward
         the pink button changes; if the host leaks inward the widget looks wrong.
         Either way you see it immediately. */
      body {
        font-family: Georgia, serif;
        max-width: 780px;
        margin: 40px auto;
        padding: 0 20px;
        background: #fdfcf8;
        color: #2b2b2b;
      }
      button {
        background: hotpink;
        border: 3px dashed purple;
        padding: 10px;
        font-size: 18px;
      }
      a { color: orange; }
      h1 { letter-spacing: -0.02em; }
    </style>
    <script type="module" crossorigin src="/static/js/gimme-comments.3cBwumN3.js"></script>
  </head>
  <body>
    <h1>A blog post someone wrote</h1>
    <p>
      The widget below is embedded the same way a real site would embed it. This
      <a href="#">link</a> and this button belong to the host page, not to us:
    </p>
    <p><button>Host page button</button></p>

    <div
      id="gimme-comments-root"
      data-gimme_comments_website_id="279eaa3c-b313-4a7d-9410-a85229c480c7"
    ></div>

  </body>
</html>
