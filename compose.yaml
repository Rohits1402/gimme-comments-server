services:
  mongo:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: gimmecomments_dev
      POSTGRES_USER: gimmecomments
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_MONGODB_URI: mongodb://mongo:27017/gimmecomments_dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gimmecomments_dev
      SPRING_DATASOURCE_USERNAME: gimmecomments
      SPRING_DATASOURCE_PASSWORD: devpassword
    depends_on:
      - mongo
      - postgres

volumes:
  mongo-data:
  postgres-data: